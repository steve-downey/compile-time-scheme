name: Documentation

# Disabled on push/PR/schedule: MrDocs cannot yet parse the project's
# C++26/reflection + Beman execution headers, so the API-reference build fails.
# Manual-only until the docs pipeline is viable.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed for gh-pages deploy on main

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          submodules: recursive

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Clang 18
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-18 libclang-18-dev

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.6"

      - name: Configure environment
        # Provisions the uv-managed toolchain (CMake 4.x, Ninja). MrDocs shells out
        # to `cmake`, and the project requires CMake >= 4.0; the runner's system
        # cmake (3.31) is too old, so the venv must be on PATH for `make docs`.
        run: make venv

      - name: Cache MrDocs
        uses: actions/cache@v6
        with:
          path: .tools/mrdocs
          key: mrdocs-${{ runner.os }}-${{ hashFiles('etc/install-mrdocs.sh') }}

      - name: Build documentation
        run: |
          source .venv/bin/activate
          make docs

      - name: Locate output directory
        id: out
        run: echo "dir=$(make -s print-docs-out)" >> "$GITHUB_OUTPUT"

      - name: Upload docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: ${{ steps.out.outputs.dir }}/
          retention-days: 14

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ steps.out.outputs.dir }}
          publish_branch: gh-pages
