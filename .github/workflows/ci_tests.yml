name: Continuous Integration Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 15 * * *'
permissions: read-all

jobs:
  beman-submodule-check:
    uses: bemanproject/infra-workflows/.github/workflows/reusable-beman-submodule-check.yml@38e1dc585a0a91f26217ec81eb3dea327586d231 # ratchet:bemanproject/infra-workflows/.github/workflows/reusable-beman-submodule-check.yml@1.7.4

  preset-test:
    uses: bemanproject/infra-workflows/.github/workflows/reusable-beman-preset-test.yml@38e1dc585a0a91f26217ec81eb3dea327586d231 # ratchet:bemanproject/infra-workflows/.github/workflows/reusable-beman-preset-test.yml@1.7.4
    with:
      # GCC-16 only: the project requires experimental -freflection (P2996),
      # which clang/appleclang/msvc do not support. See CLAUDE.md (GCC16/C++26 baseline).
      matrix_config: >
        [
          {"preset": "gcc-debug", "image": "ghcr.io/bemanproject/infra-containers-gcc:latest"},
          {"preset": "gcc-release", "image": "ghcr.io/bemanproject/infra-containers-gcc:latest"}
        ]

  build-and-test:
    uses: bemanproject/infra-workflows/.github/workflows/reusable-beman-build-and-test.yml@38e1dc585a0a91f26217ec81eb3dea327586d231 # ratchet:bemanproject/infra-workflows/.github/workflows/reusable-beman-build-and-test.yml@1.7.4
    with:
      matrix_config: >
        {
          "gcc": [
            { "versions": ["16"],
              "tests": [
                { "cxxversions": ["c++26"],
                  "tests": [
                    { "stdlibs": ["libstdc++"],
                      "tests": [
                        "Debug.Default", "Release.Default", "Release.TSan",
                        "Release.MaxSan", "Debug.Werror",
                        "Debug.Coverage"
                      ]
                    }
                  ]
                }
              ]
            }
          ]
        }

  create-issue-when-fault:
    needs: [preset-test, build-and-test]
    if: failure() && github.event_name == 'schedule'
    uses: bemanproject/infra-workflows/.github/workflows/reusable-beman-create-issue-when-fault.yml@38e1dc585a0a91f26217ec81eb3dea327586d231 # ratchet:bemanproject/infra-workflows/.github/workflows/reusable-beman-create-issue-when-fault.yml@1.7.4
