# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception

# Smoke-test the project's own `make` workflow against extrinsic drift
# (dependency updates, uv-pinned tool versions, base-image/compiler changes).
#
# Runs on a base Ubuntu dev image, which carries the same stock GCC-16 used for
# local development (reflection / -freflection is mainline in GCC 16). This is
# deliberately NOT the Beman reusable system-compiler harness — it just exercises
# the real Makefile build+test path with full tooling (ccache available).
name: Make Workflow Smoke Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 15 * * *'

permissions:
  contents: read

jobs:
  make-build-test:
    name: make compile + test (Ubuntu GCC-16)
    runs-on: ubuntu-latest
    container:
      # ubuntu:devel tracks the current Ubuntu dev release, whose archive carries
      # GCC-16 (the same package used locally). Tracking devel is intentional: it
      # surfaces extrinsic toolchain drift early.
      image: ubuntu:devel
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Install toolchain
        shell: bash
        run: |
          # Installed before checkout so git is available for submodule fetch.
          # gcc-16/g++-16 provide reflection; ccache is the Makefile's launcher.
          apt-get update
          apt-get install -y --no-install-recommends \
            gcc-16 g++-16 ccache make git ca-certificates curl python3

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'recursive'

      - name: Trust workspace
        shell: bash
        # The job runs as root but the checkout is owned by the runner uid, so git
        # reports "dubious ownership" when the Makefile invokes submodule commands.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.6"

      - name: Configure environment
        shell: bash
        run: make venv

      - name: Compile
        shell: bash
        run: |
          source .venv/bin/activate
          make compile

      - name: Test
        shell: bash
        run: |
          source .venv/bin/activate
          make ctest

      # Debug is -O0, the default Asan config is -O3, and neither witnesses
      # what the other does. The step above is the Asan leg; without this one
      # nothing on the Makefile path ever runs unoptimized, and an unspecified
      # evaluation order that the optimizer happens to resolve correctly is
      # invisible. See docs/verification-matrix.md.
      - name: Test (Debug, -O0)
        shell: bash
        run: |
          source .venv/bin/activate
          make CONFIG=Debug test
