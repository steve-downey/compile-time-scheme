# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception

name: Makefile Workflow Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 15 * * *'
permissions:
  contents: read

jobs:
  test_matrix:
    strategy:
      fail-fast: false
    name: Test System Compiler with Makefile
    runs-on: ubuntu-latest
    container:
      # The project requires the experimental reflection GCC-16 (-freflection / C++26),
      # which is not apt-installable. Use the Beman reflection container whose default
      # g++ already is that compiler (the same image the preset/build-and-test CI uses).
      image: ghcr.io/bemanproject/infra-containers-gcc:latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: 'recursive'
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          # Install a specific version of uv.
          version: "0.11.6"
      - name: Install system tools
        shell: bash
        run: |
          # The reflection GCC-16 is already the default compiler in this container.
          # Only ccache is additionally needed (used as the CMake compiler launcher).
          apt-get update
          apt-get install -y --no-install-recommends ccache

      - name: Configure Environment
        shell: bash
        run: |
          make venv

        env:
          CMAKE_GENERATOR: "Ninja Multi-Config"
      - name: Build
        shell: bash
        run: |
          source .venv/bin/activate
          make compile
      - name: Test
        shell: bash
        run: |
          source .venv/bin/activate
          make test
      - name: Generate Coverage Files
        shell: bash
        run: |
          source .venv/bin/activate
          make coverage
      - name: Lint
        shell: bash
        run: |
          source .venv/bin/activate
          make lint
      - name: Manual Lint
        shell: bash
        run: |
          source .venv/bin/activate
          make lint
      - name: Test Install
        shell: bash
        run: |
          source .venv/bin/activate
          make testinstall
