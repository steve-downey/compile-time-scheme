# $schema: https://mrdocs.com/docs/mrdocs/develop/_attachments/mrdocs.schema.json
# yaml-language-server: $schema=https://mrdocs.com/docs/mrdocs/develop/_attachments/mrdocs.schema.json

---
source-root: ..
# Scope: document the non-reflection layers only.  The sender/reflection
# modules require GCC16 -freflection which mrdocs (clang-based) cannot parse.
input:
  - ../src/smd/kit/foundation
  - ../src/smd/cl/foundation
  - ../src/smd/cl/symbol
  - ../src/smd/cl/reader
  - ../src/smd/cl/core
  - ../src/smd/cl/elaborator
  - ../src/smd/cl/eval
exclude-patterns:
  - '**/*.test.cpp'
  - '**/detail/**'
includes:
  - ../src
file-patterns:
  - '*.hpp'
include-symbols:
  - 'smd::**'
multipage: true
generator: adoc
output: modules/ROOT/pages/reference
extract-private: false
cmake: >-
  -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
  -DSCHEMEPOC_ENABLE_TESTING=OFF
  -DCMAKE_TOOLCHAIN_FILE=etc/clang-18-toolchain.cmake
  -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES=infra/cmake/use-fetch-content.cmake
base-url: https://github.com/steve-downey/compile-time-scheme/blob/main/
